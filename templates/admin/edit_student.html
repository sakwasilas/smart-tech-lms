<!DOCTYPE html>
<html>

<head>

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>

<div class="container mt-4">

<h2>Edit Student</h2>


<form method="POST">


<div class="mb-3">

<label>Full Name</label>

<input type="text"
name="fullname"
class="form-control"
value="{{ student.fullname }}"
required>

</div>



<div class="mb-3">

<label>Phone</label>

<input type="text"
name="phone"
class="form-control"
value="{{ student.phone }}"
required>

</div>



<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
class="form-control"
value="{{ student.email }}"
required>

</div>



<div class="mb-3">

<label>Status</label>

<select name="status" class="form-control">

<option value="pending"
{% if student.status == 'pending' %}selected{% endif %}>
Pending
</option>


<option value="approved"
{% if student.status == 'approved' %}selected{% endif %}>
Approved
</option>


</select>

</div>



<button class="btn btn-primary">
Update Student
</button>


<a href="{{ url_for('manage_students') }}"
class="btn btn-secondary">
Cancel
</a>


</form>


</div>

</body>

</html>
