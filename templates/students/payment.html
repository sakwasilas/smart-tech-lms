<!DOCTYPE html>
<html>

<head>

<title>
Course Payment
</title>


<style>

body{

font-family:Arial;
background:#f4f6f9;
padding:40px;

}


.card{

max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px #ccc;

}


h2{

color:#0d6efd;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;

}


button{

width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
cursor:pointer;

}


button:hover{

background:#084298;

}


.info{

background:#f1f5ff;
padding:15px;
border-radius:8px;

}


</style>

</head>


<body>


<div class="card">


<h2>
Complete Payment
</h2>


<div class="info">


<h3>
{{ enrollment.course.course_name }}
</h3>


<p>

Amount:

<strong>
Ksh {{ enrollment.course.fee }}
</strong>

</p>


<p>

Duration:

{{ enrollment.course.duration }}

</p>


</div>



<br>


<p>
Pay using:
</p>


<p>
M-Pesa Till Number:
<strong>
123456
</strong>
</p>


<p>
After payment enter transaction details:
</p>



<form action="/submit_payment/{{ enrollment.id }}" method="POST">



<input 
type="text"
name="phone"
placeholder="M-Pesa Phone Number"
required>



<input
type="text"
name="transaction_code"
placeholder="Transaction Code"
required>



<button>

Submit Payment

</button>


</form>


</div>


</body>

</html>
