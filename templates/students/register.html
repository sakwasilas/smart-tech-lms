<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>


<style>

body {

    font-family: Arial, sans-serif;
    background: #f4f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

}


.container {

    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0px 4px 12px rgba(0,0,0,0.2);
    width:350px;

}


h1,h2 {

    text-align:center;
    color:#2c3e50;

}


label {

    display:block;
    margin-top:10px;
    font-weight:bold;

}


input {

    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;

}


button {

    width:100%;
    padding:12px;
    margin-top:20px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}


button:hover {

    background:#2980b9;

}


.footer {

    text-align:center;
    margin-top:15px;

}


.alert {

    background:#f8d7da;
    color:#721c24;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;

}


</style>


</head>


<body>


<div class="container">


<h1>SMART TECH LMS</h1>

<h2>Student Registration</h2>


{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="alert">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}



<form action="{{ url_for('student_register') }}" method="POST">



<label>Full Name:</label>

<input 
type="text"
name="fullname"
placeholder="Enter full name"
required>



<label>Phone Number:</label>

<input 
type="text"
name="phone"
placeholder="Enter phone number"
required>



<label>Email:</label>

<input 
type="email"
name="email"
placeholder="Enter email"
required>



<label>Password:</label>

<input 
type="password"
name="password"
placeholder="Enter password"
required>



<label>Confirm Password:</label>

<input 
type="password"
name="confirm_password"
placeholder="Confirm password"
required>



<button type="submit">

Register

</button>



</form>



<div class="footer">

Already registered?

<a href="{{ url_for('login') }}">

Login here

</a>


</div>


</div>


</body>

</html>
