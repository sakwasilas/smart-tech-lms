<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Flask MySQL Bootcamp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 10px;
        }

        h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .price-tag {
            display: inline-block;
            background: linear-gradient(135deg, #f7c948, #f59e0b);
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1a202c;
            margin: 15px 0;
        }

        .price-tag .old {
            text-decoration: line-through;
            color: #e53e3e;
            font-size: 0.9rem;
            margin-left: 8px;
        }

        p {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 50px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 45px rgba(102, 126, 234, 0.5);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .features span {
            font-size: 0.85rem;
            color: #4a5568;
        }

        .features i {
            margin-right: 6px;
            color: #667eea;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐍</div>
        <h1>Python <span>+</span> Flask <span>+</span> MySQL</h1>
        
        <div class="price-tag">
            KES 350 <span class="old">KES 2,500</span>
        </div>

        <p>
            Master web development from zero. <br>
            6 beginner projects — build real apps.
        </p>

        <a href="https://smart-tech-lms.onrender.com" class="btn">
            🚀 Enroll Now
        </a>

        <div class="features">
            <span><i class="fas fa-users"></i> 200+ Students</span>
            <span><i class="fas fa-code"></i> 6 Projects</span>
            <span><i class="fas fa-certificate"></i> Certificate</span>
            <span><i class="fas fa-phone"></i> 24/7 Support</span>
        </div>

        <div class="footer">
            Click Enroll Now to access the full course
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
