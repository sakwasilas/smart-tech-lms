<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - {{ course.course_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f9; }
        
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            padding: 14px 0;
            box-shadow: 0 4px 25px rgba(102, 126, 234, 0.35);
        }
        .navbar-custom .navbar-brand {
            font-weight: 800;
            font-size: 1.3rem;
            color: white !important;
        }
        .navbar-custom .navbar-brand i { margin-right: 10px; }
        
        .btn-nav {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            border: none;
            color: white;
            background: rgba(255,255,255,0.2);
        }
        .btn-nav:hover { background: rgba(255,255,255,0.3); color: white; transform: translateY(-2px); }
        
        .card-modern {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
            background: white;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-modern .card-header-custom {
            padding: 16px 24px;
            font-weight: 700;
            border-bottom: 2px solid #f0f4f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }
        .card-modern .card-header-custom i { color: #667eea; margin-right: 8px; }
        .card-modern .card-body-custom { padding: 24px; }
        
        .form-control-modern {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 10px 14px;
            transition: all 0.3s;
            font-size: 0.9rem;
            width: 100%;
        }
        .form-control-modern:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            outline: none;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4); color: white; }
        
        .question-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        .question-box:hover { border-color: #667eea; }
        
        .btn-add-question {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-add-question:hover { background: #27ae60; color: white; transform: translateY(-2px); }
        
        .btn-remove-question {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .btn-remove-question:hover { background: #c0392b; color: white; }
        
        @media (max-width: 768px) {
            .card-modern .card-body-custom { padding: 16px; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('teacher_dashboard') }}">
            <i class="fas fa-graduation-cap"></i> LMS Teacher
        </a>
        <div>
            <a href="{{ url_for('manage_course_modules', course_id=course.id) }}" class="btn-nav">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <a href="{{ url_for('logout') }}" class="btn-nav" style="background: rgba(231,76,60,0.8);">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card-modern">
                <div class="card-header-custom">
                    <span><i class="fas fa-plus-circle"></i> Create Quiz - {{ course.course_name }}</span>
                </div>
                <div class="card-body-custom">
                    <form method="POST" id="quizForm">
                        <!-- Quiz Details -->
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Quiz Title</label>
                                <input type="text" name="title" class="form-control-modern" placeholder="e.g., Python Basics Quiz" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Module (Optional)</label>
                                <select name="module_id" class="form-control-modern">
                                    <option value="">-- All Modules --</option>
                                    {% for module in modules %}
                                    <option value="{{ module.id }}">Module {{ module.module_number }}: {{ module.title }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control-modern" rows="2" placeholder="Quiz description..."></textarea>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Time Limit (minutes)</label>
                                <input type="number" name="time_limit" class="form-control-modern" value="30" min="1">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Passing Score (%)</label>
                                <input type="number" name="passing_score" class="form-control-modern" value="50" min="0" max="100">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-control-modern">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>

                        <hr>

                        <!-- Questions Section -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5><i class="fas fa-question-circle"></i> Questions</h5>
                            <button type="button" class="btn-add-question" onclick="addQuestion()">
                                <i class="fas fa-plus"></i> Add Question
                            </button>
                        </div>

                        <div id="questionsContainer">
                            <!-- Questions will be added here -->
                        </div>

                        <input type="hidden" name="question_count" id="questionCount" value="0">

                        <div class="mt-4">
                            <button type="submit" class="btn-submit">
                                <i class="fas fa-save"></i> Create Quiz
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let questionIndex = 0;

    function addQuestion() {
        const container = document.getElementById('questionsContainer');
        const questionHTML = `
            <div class="question-box" id="question_${questionIndex}">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h6>Question ${questionIndex + 1}</h6>
                    <button type="button" class="btn-remove-question" onclick="removeQuestion(${questionIndex})">
                        <i class="fas fa-times"></i> Remove
                    </button>
                </div>
                <div class="row">
                    <div class="col-12 mb-2">
                        <label class="form-label">Question</label>
                        <input type="text" name="question_${questionIndex}" class="form-control-modern" placeholder="Enter question" required>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Option A</label>
                        <input type="text" name="option_a_${questionIndex}" class="form-control-modern" placeholder="Option A" required>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Option B</label>
                        <input type="text" name="option_b_${questionIndex}" class="form-control-modern" placeholder="Option B" required>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Option C</label>
                        <input type="text" name="option_c_${questionIndex}" class="form-control-modern" placeholder="Option C">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Option D</label>
                        <input type="text" name="option_d_${questionIndex}" class="form-control-modern" placeholder="Option D">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Correct Answer</label>
                        <select name="correct_answer_${questionIndex}" class="form-control-modern" required>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Points</label>
                        <input type="number" name="points_${questionIndex}" class="form-control-modern" value="1" min="1">
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', questionHTML);
        questionIndex++;
        document.getElementById('questionCount').value = questionIndex;
    }

    function removeQuestion(index) {
        const element = document.getElementById(`question_${index}`);
        if (element) {
            element.remove();
            // Re-number remaining questions
            const questions = document.querySelectorAll('.question-box');
            questions.forEach((q, i) => {
                q.id = `question_${i}`;
                const label = q.querySelector('h6');
                if (label) label.textContent = `Question ${i + 1}`;
                // Update name attributes
                const inputs = q.querySelectorAll('input, select');
                inputs.forEach(input => {
                    const name = input.getAttribute('name');
                    if (name) {
                        const parts = name.split('_');
                        if (parts.length > 1) {
                            input.setAttribute('name', `${parts[0]}_${i}`);
                        }
                    }
                });
            });
            questionIndex = questions.length;
            document.getElementById('questionCount').value = questionIndex;
        }
    }

    // Add first question by default
    document.addEventListener('DOMContentLoaded', function() {
        addQuestion();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
