<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f9; }
        
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            padding: 14px 0;
            box-shadow: 0 4px 25px rgba(102, 126, 234, 0.35);
        }
        .navbar-custom .navbar-brand {
            font-weight: 800;
            font-size: 1.3rem;
            color: white !important;
        }
        .navbar-custom .navbar-brand i { margin-right: 10px; }
        
        .btn-nav {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            border: none;
            color: white;
            background: rgba(255,255,255,0.2);
        }
        .btn-nav:hover { background: rgba(255,255,255,0.3); color: white; transform: translateY(-2px); }
        
        .card-modern {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
            background: white;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-modern .card-header-custom {
            padding: 16px 24px;
            font-weight: 700;
            border-bottom: 2px solid #f0f4f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }
        .card-modern .card-header-custom i { color: #667eea; margin-right: 8px; }
        .card-modern .card-body-custom { padding: 24px; }
        
        .form-control-modern {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 10px 14px;
            transition: all 0.3s;
            font-size: 0.9rem;
            width: 100%;
        }
        .form-control-modern:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            outline: none;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(46, 204, 113, 0.4); color: white; }
        
        .question-display {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
        }
        .question-display .q-title { font-weight: 700; font-size: 1.1rem; }
        .question-display .q-meta { font-size: 0.85rem; color: #636e72; }
        .question-display .q-content { margin-top: 10px; }
        
        @media (max-width: 768px) {
            .card-modern .card-body-custom { padding: 16px; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('teacher_dashboard') }}">
            <i class="fas fa-graduation-cap"></i> LMS Teacher
        </a>
        <div>
            <a href="{{ url_for('teacher_dashboard') }}" class="btn-nav">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <a href="{{ url_for('logout') }}" class="btn-nav" style="background: rgba(231,76,60,0.8);">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-modern">
                <div class="card-header-custom">
                    <span><i class="fas fa-reply"></i> Answer Question</span>
                    <span class="badge" style="background: #f39c12; color: white; padding: 4px 14px; border-radius: 30px;">
                        {{ question.status }}
                    </span>
                </div>
                <div class="card-body-custom">
                    <div class="question-display">
                        <div class="q-title">{{ question.title }}</div>
                        <div class="q-meta">
                            <i class="fas fa-user"></i> {{ question.student.fullname }}
                            <i class="fas fa-calendar-alt ms-2"></i> {{ question.created_at }}
                        </div>
                        <div class="q-content">{{ question.content }}</div>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Your Answer</label>
                            <textarea name="content" class="form-control-modern" rows="6" placeholder="Type your answer here..." required></textarea>
                        </div>
                        <button type="submit" class="btn-submit">
                            <i class="fas fa-paper-plane"></i> Post Answer
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
