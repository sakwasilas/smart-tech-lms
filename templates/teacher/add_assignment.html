<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Assignment - {{ course.course_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f9; }
        
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            padding: 14px 0;
            box-shadow: 0 4px 25px rgba(102, 126, 234, 0.35);
        }
        .navbar-custom .navbar-brand {
            font-weight: 800;
            font-size: 1.3rem;
            color: white !important;
        }
        .navbar-custom .navbar-brand i { margin-right: 10px; }
        
        .btn-nav {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            border: none;
            color: white;
            background: rgba(255,255,255,0.2);
        }
        .btn-nav:hover { background: rgba(255,255,255,0.3); color: white; transform: translateY(-2px); }
        
        .card-modern {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
            background: white;
            overflow: hidden;
        }
        .card-modern .card-header-custom {
            padding: 16px 24px;
            font-weight: 700;
            border-bottom: 2px solid #f0f4f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }
        .card-modern .card-header-custom i { color: #667eea; margin-right: 8px; }
        .card-modern .card-body-custom { padding: 24px; }
        
        .form-control-modern {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 10px 14px;
            transition: all 0.3s;
            font-size: 0.9rem;
            width: 100%;
        }
        .form-control-modern:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            outline: none;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(46, 204, 113, 0.4); color: white; }
        
        .btn-cancel {
            background: #e9ecef;
            color: #2d3436;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-cancel:hover { background: #dee2e6; color: #2d3436; }
        
        .alert-custom {
            border-radius: 12px;
            padding: 14px 20px;
            border: none;
            margin-bottom: 20px;
        }
        .alert-custom.success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .alert-custom.danger { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .alert-custom.warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        
        @media (max-width: 768px) {
            .card-modern .card-body-custom { padding: 16px; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('teacher_dashboard') }}">
            <i class="fas fa-graduation-cap"></i> LMS Teacher
        </a>
        <div>
            <a href="{{ url_for('manage_course_modules', course_id=course.id) }}" class="btn-nav">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <a href="{{ url_for('logout') }}" class="btn-nav" style="background: rgba(231,76,60,0.8);">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card-modern">
                <div class="card-header-custom">
                    <span><i class="fas fa-plus-circle"></i> Add Assignment to {{ course.course_name }}</span>
                </div>
                <div class="card-body-custom">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert-custom {{ category }}">
                            <i class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'danger' %}exclamation-circle{% else %}info-circle{% endif %} me-2"></i>
                            {{ message }}
                        </div>
                        {% endfor %}
                    {% endif %}
                    {% endwith %}
                    
                    <form method="POST" action="{{ url_for('teacher_add_assignment', course_id=course.id) }}">
                        <div class="mb-3">
                            <label class="form-label">Assignment Title <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control-modern" placeholder="e.g., Python Assignment 1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control-modern" rows="2" placeholder="Brief description of the assignment"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Instructions</label>
                            <textarea name="instructions" class="form-control-modern" rows="4" placeholder="Detailed instructions for students"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" name="due_date" class="form-control-modern">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Max Score</label>
                                <input type="number" name="max_score" class="form-control-modern" value="100" min="1">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Module (Optional)</label>
                                <select name="module_id" class="form-control-modern">
                                    <option value="">No Module</option>
                                    {% for module in modules %}
                                    <option value="{{ module.id }}">Module {{ module.module_number }}: {{ module.title }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-control-modern">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <button type="submit" class="btn-submit">
                                    <i class="fas fa-save"></i> Create Assignment
                                </button>
                            </div>
                            <div class="col-md-6">
                                <a href="{{ url_for('manage_course_modules', course_id=course.id) }}" class="btn-cancel">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
